name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose --all-targets --all-features
      # --all-features so the serde-gated tests actually run; without it the
      # binary table tests are silently skipped.
      - run: cargo test --verbose --all-features

  minimum_supported_rust_version:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - run: cargo +${{ steps.msrv.outputs.version }} check --all-features

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # Every feature must build on its own. Optional dependencies that leak into
      # ungated code only show up here.
      - name: Build each feature combination
        run: |
          set -euxo pipefail
          cargo build --no-default-features
          for feature in fs gzip tokio serde rayon; do
            cargo build --no-default-features --features "$feature"
          done
          cargo build --no-default-features --features fs,serde
          cargo build --no-default-features --features gzip,tokio,fs,rayon,serde
          cargo build --all-features
      - run: cargo test --no-default-features --features gzip,tokio,fs,rayon,serde

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # No LFS checkout: the fixtures are excluded from the package, so this also
      # proves the packaged crate builds without them.
      - run: cargo package --allow-dirty
      - name: Check the package fits in the crates.io size limit
        run: |
          set -euo pipefail
          crate=$(ls target/package/*.crate)
          size=$(wc -c < "$crate")
          echo "$crate is $size bytes"
          if [ "$size" -gt 10485760 ]; then
            echo "::error::Package exceeds the 10 MiB crates.io limit"
            exit 1
          fi
